# =============================================================================
# nginx.conf — Custom configuration for serving a React SPA on port 8080
# Designed to run as a non-root user (no writes to /var/run or /var/log root paths)
# =============================================================================

# Run in the foreground (Docker requires this); worker count auto-detected
worker_processes auto;

# Non-root writable pid location (matches the path created in the Dockerfile)
pid /var/run/nginx/nginx.pid;

# Limit worker connections for a lean container
events {
    worker_connections 1024;
}

http {
    # Basic MIME types so CSS/JS/fonts are served with correct Content-Type
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging — write to stdout/stderr so Docker captures the logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Performance optimisations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    server {
        # Listen on 8080 (non-privileged port — required for non-root user)
        listen 8080;
        server_name localhost;

        # Root directory that holds the React build output
        root /usr/share/nginx/html;
        index index.html;

        # --------------------------------------------------------------------
        # SPA routing — always fall back to index.html so React Router works
        # --------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively (hashed filenames mean safe long TTLs)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options       "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-XSS-Protection      "1; mode=block" always;

        # Deny access to hidden files (e.g. .env, .git)
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}